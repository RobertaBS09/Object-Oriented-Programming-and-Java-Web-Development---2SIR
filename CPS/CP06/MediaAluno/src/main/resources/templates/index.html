<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Calcular Media</title>
</head>
<body>
    <h1> Calcular Média</h1>
    <form th:action="@{/media/calcular}" method="get">
        <label>Nome
            <input type="text" name="nome" th:value="${nome}">
        </label>

        <label>Nota 1:
            <input type="number" step="any" name="n1" th:value="${n1}">
        </label>
        <label>Nota 2:
            <input type="number" step="any" name="n2" th:value="${n2}">
        </label>

        <select name="tipo">
            <option value="simples" th:selected="${tipo == 'simples'}">Média Simples</option>
            <option value="ponderada" th:selected="${tipo == 'ponderada'}">Média Ponderada</option>
        </select>

        <button type="submit">Submeter</button>
    </form>

<p class="media" th:if="${media != null}"th:text=" ${nome} +' | Média:' +  ${#numbers.formatDecimal(media, 1, 2)}+ ' | Situação - '+${situacao}"></p>
    <p class="erro" th:if="${erro!=null}" th:text="'Erro:'+${erro}"></p>
</body>
</html>
