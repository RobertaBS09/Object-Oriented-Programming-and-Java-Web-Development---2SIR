<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parcelamento</title>
</head>
<body>
<h1> Parcelamento</h1>

<label> Valor
    <input type="number" step="any" id="valor" name="valor">
</label>
<select id="parcelas">
    <option value="1"> 1</option>
    <option value="3"> 3</option>
    <option value="6"> 6</option>
    <option value="12"> 12</option>
</select>

<button onclick="calcular()"> Submeter</button>
<p id="resultado"></p>

<script>
    async function calcular() {
        const valor = document.getElementById("valor").value;
        const parcelas = document.getElementById("parcelas").value;
        const resultado = document.getElementById("resultado");

        if (valor === "" || parcelas === "") {
            resultado.textContent="Preencha valor e parcelas!";
            return
        }

        const resposta = await fetch(`/api/parcelamento?valor=${valor}&parcelas=${parcelas}`)
        const dados = await resposta.json();

        if (resposta.ok) {
            resultado.textContent = `Valor: ${dados.valor} | Parcelas: ${dados.parcelas} | Esperado: ${dados.parcelas} de R$${dados.totalparcelas} (total R$${dados.resultado})`
        } else {
            resultado.textContent = `Erro: ${dados.message}`
        }

    }


</script>
</body>
</html>
